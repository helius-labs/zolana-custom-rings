[package]
name = "ring-indexer"
version = "0.1.0"
description = "Custom ring indexer beside Photon"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[features]
surfpool-fixture = []

[dependencies]
anyhow = { workspace = true }
bs58 = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
custom-ring-interface = { workspace = true }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
jsonrpsee = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-account = { workspace = true }
solana-account-decoder-client-types = { workspace = true, features = ["agave-unstable-api"] }
solana-address = { workspace = true, features = ["curve25519"] }
solana-clock = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-status-client-types = { workspace = true, features = ["agave-unstable-api"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "time"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
spr-indexer-api = { workspace = true }
spr-interface = { workspace = true }
zolana-ring-indexer = { workspace = true }
zolana-ring-policy = { workspace = true }
spr-rpc-http = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
hex = { workspace = true }
hyper-util = { workspace = true }
zolana-ring-member-registry = { workspace = true }
