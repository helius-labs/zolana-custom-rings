[package]
name = "custom-ring-cli"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "custom_ring_cli"
path = "src/lib.rs"

[[bin]]
name = "zolana-ring"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
custom-ring-interface = { workspace = true }
custom-ring-sdk = { workspace = true }
dialoguer = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["wincode"] }
solana-sbpf = { workspace = true }
solana-signature = { workspace = true, features = ["verify"] }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
solana-transaction-error = { workspace = true }
spl-token-2022-interface = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
zolana-cli-common = { workspace = true }
tokio = { workspace = true, features = ["time"] }
spr-api = { workspace = true }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-indexer-api = { workspace = true }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
zolana-ring-client = { workspace = true, features = ["rpc", "solana-rpc"] }
zolana-ring-indexer = { workspace = true }
zolana-ring-keys = { workspace = true }
zolana-ring-member-registry = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-ring-transaction = { workspace = true }
zolana-secret-file = { workspace = true }
spr-transaction = { workspace = true, features = ["serde"] }

[dev-dependencies]
solana-rpc-client-api = { workspace = true }
spr-event = { workspace = true }
