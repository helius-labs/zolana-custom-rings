# A ring that reads a curator's block list and keeps its own grant lists.
# An output owner passes when the curator does not block it and the ring's own
# authority has put it on the allow list or the approval list. A grant lifts no
# denial. The curator is named per cluster.

name = "curated-blocklist-with-grants"
target = "localnet"
# Replace with the id of keys/program-keypair.json, `zolana-ring new` writes one.
program_id = "71xpmf2e94nEd9T1S32trTQnhY39xfSUeNW7GH4quTw6"
authority_keypair = "~/.config/solana/id.json"

[localnet]
rpc = "http://127.0.0.1:8899"
indexer = "http://127.0.0.1:8784"
prover = "http://127.0.0.1:3001"
ring_rpc = "http://127.0.0.1:8785"

[devnet]
rpc = "https://api.devnet.solana.com"
indexer = "https://d2xah7tnhdhcom.cloudfront.net"
prover = "https://d55y5ksdsm1vw.cloudfront.net"
ring_rpc = "https://d24brah9h1i4q9.cloudfront.net"
ring_rpc_pubkey = "C8TeRCdueRdXj3y4uFDtNywYThc3qeiH2ZGfcbYZzVSs"

[policy]

[policy.sources.localnet]
# the block list reads the member registry of the named curator ring
block = "Gy3wjbn1MpGvJNrjinhWuSzLsp7HLazpmbQynmmMd91Z"

[policy.sources.devnet]
# the block list reads the member registry of the named curator ring
block = "8tDbqVsQ8ujVVFXP2oSNkAcCTtJgKLJqxqnSCnCYZuCZ"

# each output owner must not be on the block list
[[policy.rules]]
subject = "output-owner"
forbid = "block"

# each output owner must be on the allow list or must be on the approval list
[[policy.rules]]
subject = "output-owner"
any = [{ require = "allow" }, { require = "approval" }]
