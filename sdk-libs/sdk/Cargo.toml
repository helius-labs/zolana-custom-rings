[package]
name = "custom-ring-sdk"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
proofs = ["spr-client/proofs"]

[dependencies]
async-trait = { workspace = true }
spr-event.workspace = true
custom-ring-interface = { workspace = true }
bytemuck = { workspace = true }
futures = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-instruction = { workspace = true }
solana-commitment-config = { workspace = true }
solana-instruction-error = { workspace = true }
solana-message = { workspace = true, features = ["wincode"] }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
serde = { workspace = true, features = ["derive"] }
solana-transaction = { workspace = true, features = ["serde"] }
solana-transaction-error = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
serde_json = { workspace = true }
wincode = { workspace = true }
zeroize = { workspace = true }
spr-api = { workspace = true }
spr-client = { workspace = true }
spr-interface = { workspace = true }
spr-program = { workspace = true }
spr-hasher = { workspace = true }
spr-indexer-api = { workspace = true }
spr-keypair = { workspace = true }
zolana-ring-client = { workspace = true, features = ["rpc"] }
zolana-ring-indexer = { workspace = true }
zolana-ring-keys = { workspace = true }
zolana-ring-member-registry = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-ring-transaction = { workspace = true }
spr-transaction = { workspace = true }
spr-tree = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
spr-client = { workspace = true, features = ["solana-rpc"] }
http = { workspace = true }
curve25519-dalek = "4.1"
hex = { workspace = true }
serde_json = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
spl-token-2022-interface = { workspace = true }
