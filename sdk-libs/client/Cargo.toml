[package]
name = "zolana-ring-client"
version = "0.1.0"
description = "Custom ring audit encryption and transaction recovery client."
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
solana-rpc = [
    "spr-client/solana-rpc",
    "dep:solana-commitment-config",
    "dep:solana-rpc-client-api",
    "dep:solana-transaction-status-client-types",
]
rpc = [
    "dep:base64",
    "dep:bytemuck",
    "dep:rand",
    "dep:solana-signer",
    "dep:zolana-secret-file",
]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
p256 = { workspace = true }
hex = { workspace = true }
custom-ring-interface = { workspace = true }
curve25519-dalek = { version = "4.1", default-features = false }
rand = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-commitment-config = { workspace = true, optional = true }
solana-rpc-client-api = { workspace = true, optional = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true, optional = true }
solana-transaction-status-client-types = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
borsh = { workspace = true }
spr-api = { workspace = true }
spr-client = { workspace = true }
spr-event = { workspace = true }
spr-event-parser = { workspace = true }
spr-interface = { workspace = true }
spr-hasher = { workspace = true }
spr-indexer-api = { workspace = true }
spr-keypair = { workspace = true }
zolana-ring-indexer = { workspace = true }
zolana-ring-keys = { workspace = true }
zolana-ring-member-registry = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-ring-transaction = { workspace = true }
zolana-secret-file = { workspace = true, optional = true }
spr-transaction = { workspace = true }

[dev-dependencies]
http = { workspace = true }
bs58 = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true, features = ["verify"] }
solana-transaction-status-client-types = { workspace = true }
tokio = { workspace = true }
zolana-ring-client = { path = ".", features = ["rpc", "solana-rpc"] }
